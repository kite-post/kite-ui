# Пайплайн тут свій, а не спільний із .github: vue-app.yml збирає образ, а цей
# репозиторій публікує npm-пакет. Бібліотек тепер дві (kite-contracts і kite-ui) —
# коли пайплайни усталяться, варто винести спільне в .github (5.6).
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Лінт, типи, тести, збірка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Поставити pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Поставити Node 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Токени згенеровано з tokens/*.json
        run: pnpm run tokens:check
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run test:unit --run
      - run: pnpm run build

  dart:
    name: Dart-пакет kite_tokens
    # tokens:check у verify ловить застарілий файл; тут — що згенерований Dart
    # узагалі компілюється (ключове слово Dart як назва токена, новий формат кольору…).
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    defaults:
      run:
        working-directory: tokens/dart
    steps:
      - uses: actions/checkout@v7
      - run: flutter pub get
      - run: flutter analyze --fatal-infos

  visual:
    name: Візуальні регресії (Storybook)
    needs: verify
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    # Той самий образ, у якому знімаються еталони (visual-update.yml): шрифти й
    # згладжування збігаються піксель у піксель.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build-storybook
      - name: Порівняти зі знімками
        run: pnpm exec playwright test
        env:
          HOME: /root

      - name: Звіт із різницею
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  publish:
    name: Публікація @kite-post/ui
    needs: [verify, dart]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@kite-post'

      - name: Тег дорівнює версії в package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$have" ]; then
            echo "::error::тег v$tag не збігається з package.json=$have — спершу make version V=$tag"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Опублікувати
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm publish --no-git-checks

      - name: Що тепер підключати
        run: |
          v="$(node -p "require('./package.json').version")"
          {
            echo "### @kite-post/ui v$v опубліковано"
            echo
            echo '```bash'
            echo "pnpm add @kite-post/ui@$v"
            echo '```'
            echo
            echo "Flutter (kite-mobile): git-залежність \`kite_tokens\`, \`ref: v$v\`, шлях \`tokens/dart\`"
          } >> "$GITHUB_STEP_SUMMARY"

  storybook:
    name: Storybook на GitHub Pages
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build-storybook

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static
      - id: deploy
        uses: actions/deploy-pages@v5
