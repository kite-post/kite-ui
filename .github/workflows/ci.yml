# Пайплайн тут свій, а не спільний із .github: vue-app.yml збирає образ, а цей
# репозиторій публікує npm-пакет. Бібліотек тепер дві (kite-contracts і kite-ui) —
# коли пайплайни усталяться, варто винести спільне в .github (5.6).
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Лінт, типи, тести, збірка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Поставити pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Поставити Node 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run test:unit --run
      - run: pnpm run build

  publish:
    name: Публікація @kite-post/ui
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@kite-post'

      - name: Тег дорівнює версії в package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$have" ]; then
            echo "::error::тег v$tag не збігається з package.json=$have — спершу make version V=$tag"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Опублікувати
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm publish --no-git-checks

      - name: Що тепер підключати
        run: |
          v="$(node -p "require('./package.json').version")"
          {
            echo "### @kite-post/ui v$v опубліковано"
            echo
            echo '```bash'
            echo "pnpm add @kite-post/ui@$v"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
