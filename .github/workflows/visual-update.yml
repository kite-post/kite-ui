# Оновлення еталонних знімків Storybook після навмисних змін вигляду.
# Запуск: Actions → «Оновити еталони» → обрати гілку. Знімки робляться в тому самому
# Linux-образі Playwright, що й перевірка в ci.yml, і комітяться в ту ж гілку.
name: Оновити еталони

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Зняти й закомітити еталони
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build-storybook
      - name: Зняти знімки
        run: pnpm exec playwright test --update-snapshots
        env:
          HOME: /root

      - name: Закомітити
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual/__screenshots__
          if git diff --cached --quiet; then
            echo 'Еталони не змінилися.'
            exit 0
          fi
          n="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          git commit -m "Еталони Storybook: оновлено $n знімків"
          git push
